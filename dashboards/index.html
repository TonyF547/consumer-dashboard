<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consumer Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --border: #e2e2df;
    --text: #1a1a19;
    --muted: #6b6b68;
    --accent: #b45309;
    --accent-bg: #fef3e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171715;
      --card-bg: #211f1c;
      --border: #35322d;
      --text: #ececea;
      --muted: #a3a19c;
      --accent: #f0a25c;
      --accent-bg: #2c2418;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 3rem;
    padding-inline: 1.25rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 0.35rem;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    margin: 0 0 2rem;
    font-size: 0.95rem;
  }
  .list { display: flex; flex-direction: column; gap: 0.75rem; }
  a.card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.1rem 1.3rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .card-title { font-weight: 600; font-size: 1rem; }
  .card-desc { color: var(--muted); font-size: 0.85rem; margin-top: 0.15rem; }
  .arrow {
    color: var(--accent);
    background: var(--accent-bg);
    border-radius: 999px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    font-size: 0.95rem;
  }
  footer {
    margin-top: 2.5rem;
    color: var(--muted);
    font-size: 0.78rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Consumer Dashboard</h1>
    <p class="sub">Select a dashboard to open it.</p>

    <div class="list">
      <a class="card" href="hub.html">
        <div>
          <div class="card-title">Hub (Financial)</div>
          <div class="card-desc">Revenue, budget vs actuals, and reconciliation detail</div>
        </div>
        <div class="arrow">&rarr;</div>
      </a>

      <!--
        Add a new card for each additional dashboard file placed in this folder, e.g.:

        <a class="card" href="consumer.html">
          <div>
            <div class="card-title">Consumer Dashboard</div>
            <div class="card-desc">Short description here</div>
          </div>
          <div class="arrow">&rarr;</div>
        </a>
      -->
    </div>

    <footer>Consumer Dashboard family &mdash; SEL LTD</footer>
  </div>
</body>
</html>
